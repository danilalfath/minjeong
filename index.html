<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A little phone, a lot of love. Unlock it and look around." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minjeong's Phone" />
    <meta property="og:description" content="A little phone, a lot of love. Unlock it and look around." />
    <meta property="og:image" content="assets/img/icons/icon-512.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Minjeong's Phone</title>

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icons/icon-180.jpg" />

    <link rel="preload" href="assets/fonts/SFPro-Regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="assets/fonts/SFPro-Bold.woff" as="font" type="font/woff" crossorigin />

    <link rel="stylesheet" href="css/ios.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/photos.css" />
    <link rel="stylesheet" href="css/messages.css" />
  </head>

  <body>
    <div id="device">
      <!-- tombol samping (hanya terlihat di layar lebar) -->
      <i class="hw hw-action"></i>
      <i class="hw hw-volup"></i>
      <i class="hw hw-voldown"></i>
      <button class="hw hw-power" id="power" type="button" aria-label="Side button (lock)"></button>

      <div id="screen" class="is-lock" data-bar="light">
        <!-- ============ HOME ============ -->
        <div class="wall" id="wall-home"></div>
        <section id="home">
          <div id="grid"></div>
          <div id="search-pill">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <circle cx="5" cy="5" r="3.7" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M7.9 7.9 11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Search
          </div>
          <div id="dock"></div>
        </section>

        <!-- ============ APP YANG SEDANG DIBUKA ============ -->
        <section id="app" hidden></section>

        <!-- ============ LOCK SCREEN ============ -->
        <div class="wall" id="wall-lock"></div>
        <section id="lock">
          <div class="lock-date" id="lock-date"></div>
          <div class="lock-time" id="lock-time"></div>
          <div class="lock-notifs" id="lock-notifs"></div>

          <button class="lock-btn left" type="button" aria-label="Flashlight" data-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M7.6 2.5h8.8v3.4c0 .5-.2 1-.5 1.4l-1.3 1.6c-.2.3-.3.6-.3 1v9.9c0 .9-.8 1.7-1.7 1.7h-1.2c-.9 0-1.7-.8-1.7-1.7V9.9c0-.4-.1-.7-.3-1L8.100 7.300c-.3-.4-.5-.9-.5-1.400V2.500Zm4.400 8.700c-.7 0-1.200.5-1.200 1.200v1.400c0 .7.5 1.200 1.200 1.200s1.200-.5 1.200-1.200v-1.400c0-.7-.5-1.200-1.200-1.200Z"
              />
            </svg>
          </button>
          <button class="lock-btn right" type="button" aria-label="Camera">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M9.300 4.500h5.400c.5 0 .9.2 1.200.6l.9 1.300h2c1.300 0 2.400 1.100 2.400 2.400v8.300c0 1.300-1.100 2.400-2.400 2.400H5.200c-1.300 0-2.400-1.100-2.400-2.400V8.800c0-1.300 1.100-2.400 2.400-2.400h2l.9-1.300c.3-.4.7-.6 1.200-.6ZM12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 1.600a2.400 2.400 0 1 1 0 4.800 2.400 2.400 0 0 1 0-4.800Z"
              />
            </svg>
          </button>

          <div class="lock-hint" id="lock-hint">Swipe up to open</div>
        </section>

        <!-- ============ PASSCODE ============ -->
        <section id="passcode" aria-hidden="true">
          <div class="pc-bg" id="pc-bg"></div>
          <div class="pc-body">
            <div class="pc-title">Enter Passcode</div>
            <div class="pc-dots"></div>
            <div class="pc-hint"></div>
            <div class="pc-pad"></div>
          </div>
          <div class="pc-foot">
            <button type="button">Emergency</button>
            <button type="button" class="pc-cancel">Cancel</button>
          </div>
        </section>

        <!-- ============ STATUS BAR ============ -->
        <div id="statusbar">
          <span class="sb-time" id="sb-time">9:41</span>
          <span class="sb-right">
            <svg class="sb-cell" viewBox="0 0 18 12" aria-hidden="true">
              <rect x="0" y="7.6" width="3" height="4.400" rx="0.9" />
              <rect x="5" y="5.2" width="3" height="6.8" rx="0.9" />
              <rect x="10" y="2.6" width="3" height="9.400" rx="0.9" />
              <rect x="15" y="0" width="3" height="12" rx="0.9" />
            </svg>
            <svg class="sb-wifi" viewBox="0 0 17 12" aria-hidden="true">
              <path d="M1.500 4.300A9.900 9.900 0 0 1 15.500 4.300" fill="none" stroke="currentColor" stroke-width="2.100" />
              <path d="M3.980 6.780A6.400 6.400 0 0 1 13.020 6.780" fill="none" stroke="currentColor" stroke-width="2.100" />
              <path d="M8.500 11.500 6.050 9.050a3.460 3.460 0 0 1 4.900 0Z" />
            </svg>
            <span class="sb-batt"><i id="sb-batt-fill"></i></span>
          </span>
        </div>
        <div id="island"></div>

        <!-- garis home di bawah layar -->
        <div id="homebar" role="button" aria-label="Home"><i></i></div>
      </div>
    </div>

    <!-- data cerita (teks saja, ringan) -->
    <script src="data/config.js"></script>
    <script src="data/photos.js"></script>
    <script src="data/messages.js"></script>
    <script src="data/notes.js"></script>
    <script src="data/calls.js"></script>
    <script src="data/instagram.js"></script>

    <!-- Notes, Phone, dan Instagram dimuat belakangan oleh ios.js (setelah HP dibuka) -->
    <script src="js/ios.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/messages.js"></script>
  </body>
</html>
